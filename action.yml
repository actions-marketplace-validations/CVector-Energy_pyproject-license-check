name: Pyproject License Check
description: Check Python project dependencies for license compliance using licensecheck

inputs:
  uv-version:
    description: uv version to use
    required: false
    default: ""
  licensecheck-version:
    description: licensecheck version to use
    required: false
    # Previously pinned to a git SHA to pick up the unreleased fix for https://github.com/FHPythonUtils/LicenseCheck/issues/137. That fix, and the fix for the missing-[tool]-table crash (https://github.com/FHPythonUtils/LicenseCheck/pull/138), are both released as of 2026.0.8.
    default: "2026.0.8"
  skip-dependencies:
    description: Space-separated list of dependencies to skip during license check
    required: false
    default: "wrapt"
  ignore-licenses:
    description: Space-separated list of license types to ignore
    required: false
    default: "MPL"
  allowed-license-references:
    description: Space-separated list of exact LicenseRef identifiers to accept
    required: false
    default: ""
  license-overrides:
    description: TOML entries and comments for exact-version license overrides
    required: false
    default: ""
  requirements-paths:
    description: Paths to search for requirements files (pyproject.toml, requirements.txt)
    required: false
    default: "."
  allow-no-packages:
    description: Treat LicenseCheck's NO_PACKAGES result as success
    required: false
    default: "false"
  app-id:
    description: GitHub App ID for accessing private repos (optional)
    required: false
    default: ""
  app-private-key:
    description: GitHub App private key for accessing private repos (optional)
    required: false
    default: ""
  repository-owner:
    description: Repository owner for GitHub App token (defaults to current repo owner)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Create GitHub App Token able to read private repos
      id: app
      if: inputs.app-id != '' && inputs.app-private-key != ''
      uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.repository-owner || github.repository_owner }} # zizmor: ignore[github-app] dependencies may span organization repositories
        permission-contents: read

    - name: Configure git to use app token for private repos
      if: steps.app.outcome == 'success'
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app.outputs.token }}
      run: |
        git config --global url."https://x-access-token:${APP_TOKEN}@github.com/".insteadOf "https://github.com/"

    - name: Set up uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        version: ${{ inputs.uv-version }}

    - name: Run license check
      shell: bash
      env:
        ALLOW_NO_PACKAGES: ${{ inputs.allow-no-packages }}
        ALLOWED_LICENSE_REFERENCES: ${{ inputs.allowed-license-references }}
        IGNORE_LICENSES: ${{ inputs.ignore-licenses }}
        LICENSE_OVERRIDES: ${{ inputs.license-overrides }}
        LICENSECHECK_VERSION_INPUT: ${{ inputs.licensecheck-version }}
        REQUIREMENTS_PATHS_INPUT: ${{ inputs.requirements-paths }}
        SKIP_DEPENDENCIES: ${{ inputs.skip-dependencies }}
      run: |
        # Build skip dependencies array if provided
        SKIP_ARGS=()
        if [[ -n "$SKIP_DEPENDENCIES" ]]; then
          IFS=' ' read -ra SKIP_DEPS <<< "$SKIP_DEPENDENCIES"
          for dep in "${SKIP_DEPS[@]}"; do
            SKIP_ARGS+=(--skip-dependencies "$dep")
          done
        fi

        # Build ignore licenses args if provided
        IGNORE_ARGS=()
        if [[ -n "$IGNORE_LICENSES" ]]; then
          IFS=' ' read -ra IGNORED_LICENSES <<< "$IGNORE_LICENSES"
          for license in "${IGNORED_LICENSES[@]}"; do
            IGNORE_ARGS+=(--ignore-licenses "$license")
          done
        fi

        # Build exact custom license-reference args if provided
        LICENSE_REF_ARGS=()
        if [[ -n "$ALLOWED_LICENSE_REFERENCES" ]]; then
          IFS=' ' read -ra ALLOWED_LICENSE_REFS <<< "$ALLOWED_LICENSE_REFERENCES"
          LICENSE_REF_ARGS=(--allowed-license-references "${ALLOWED_LICENSE_REFS[@]}")
        fi

        if [[ -n "$LICENSE_OVERRIDES" ]]; then
          if [[ -e licensecheck.toml ]]; then
            echo "::error::license-overrides cannot be used when licensecheck.toml already exists"
            exit 1
          fi
          printf '[tool.licensecheck.license_overrides]\n%s\n' "$LICENSE_OVERRIDES" > licensecheck.toml
          trap 'rm -f licensecheck.toml' EXIT
        fi

        # Determine uvx --from spec: git URLs use @, PyPI versions use ==
        LICENSECHECK_VERSION="$LICENSECHECK_VERSION_INPUT"
        if [[ "$LICENSECHECK_VERSION" == git+* ]]; then
          FROM_SPEC="licensecheck @ ${LICENSECHECK_VERSION}"
        else
          FROM_SPEC="licensecheck==${LICENSECHECK_VERSION}"
        fi

        IFS=' ' read -ra REQUIREMENTS_PATHS <<< "$REQUIREMENTS_PATHS_INPUT"
        mapfile -d '' REQUIREMENTS_FILES < <(
          find "${REQUIREMENTS_PATHS[@]}" \( -name 'pyproject.toml' -o -name 'requirements.txt' \) -print0
        )
        if [[ ${#REQUIREMENTS_FILES[@]} -eq 0 ]]; then
          echo "No Python requirement files found."
          exit 0
        fi

        set +e
        uvx --from "$FROM_SPEC" licensecheck --zero \
          "${SKIP_ARGS[@]}" \
          "${IGNORE_ARGS[@]}" \
          "${LICENSE_REF_ARGS[@]}" \
          --requirements-paths "${REQUIREMENTS_FILES[@]}"
        LICENSECHECK_STATUS=$?
        set -e

        if [[ "$LICENSECHECK_STATUS" -eq 3 && "$ALLOW_NO_PACKAGES" == "true" ]]; then
          echo "::notice::No dependency packages found; passing because allow-no-packages is enabled."
          exit 0
        fi

        exit "$LICENSECHECK_STATUS"

branding:
  icon: shield
  color: orange
